name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      exists: ${{ steps.check_release.outputs.exists }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION does not exist, proceeding..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        if: steps.check_release.outputs.exists == 'false'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Build Python package
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          EXPECTED="${VERSION#v}"

          # The release-trigger workflow bumps pyproject.toml to the release
          # version before creating the tag, so the tagged commit must already
          # carry the matching (non-dev) version. Fail loudly otherwise to
          # avoid publishing a mislabelled artifact to PyPI.
          PROJECT_VERSION=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          if [ "$PROJECT_VERSION" != "$EXPECTED" ]; then
            echo "::error::pyproject.toml version ($PROJECT_VERSION) does not match tag ($EXPECTED)."
            echo "The release-trigger workflow should bump pyproject.toml before tagging."
            exit 1
          fi

          uv build
          echo "Built artifacts:"
          ls -la dist/

      - name: Generate release notes
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NO_V=${VERSION#v}

          # Find previous tag
          PREVIOUS_TAG=$(git tag -l 'v*' --sort=-version:refname | grep -v "^${VERSION}$" | head -n 1)
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=""
          fi

          # Get commits since previous tag
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMIT_COUNT=$(git rev-list --count HEAD)
            if [ "$COMMIT_COUNT" -gt 20 ]; then
              COMMITS=$(git log --oneline --pretty=format:"- %s" --no-merges HEAD~20..HEAD)
            else
              COMMITS=$(git log --oneline --pretty=format:"- %s" --no-merges)
            fi
          else
            COMMITS=$(git log --oneline --pretty=format:"- %s" --no-merges "$PREVIOUS_TAG"..HEAD)
          fi

          cat > release_notes.md << NOTES_EOF
          ## Install

          Install the latest published release from PyPI:

          \`\`\`bash
          uv tool install specify-cli
          specify init my-project
          \`\`\`

          Or pin this exact version directly from source:

          \`\`\`bash
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@${VERSION}
          specify init my-project
          \`\`\`

          NOTES_EOF

          echo "## What's Changed" >> release_notes.md
          echo "" >> release_notes.md
          echo "$COMMITS" >> release_notes.md

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NO_V=${VERSION#v}
          gh release create "$VERSION" \
            dist/*.whl \
            dist/*.tar.gz \
            --title "Spec Kit - $VERSION_NO_V" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload distribution artifacts
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

  pypi-publish:
    needs: release
    if: needs.release.outputs.exists == 'false'
    runs-on: ubuntu-latest
    # The `pypi` environment must be configured on the repository with a PyPI
    # Trusted Publisher pointing at this workflow. No tokens are stored — the
    # OIDC `id-token` below is exchanged for a short-lived PyPI credential.
    environment:
      name: pypi
      url: https://pypi.org/project/specify-cli/
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI
        # `--trusted-publishing always` fails the job if OIDC is unavailable
        # rather than silently falling back. `--check-url` makes re-runs
        # idempotent by skipping files already present on PyPI.
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple/specify-cli/ \
            dist/*
